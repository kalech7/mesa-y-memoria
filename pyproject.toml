[project]
name = "clarificacion-longitudinal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
closure_v4 = "research.closure_v4:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[dependency-groups]
research = [
    "pytest>=8,<10",
    "numpy>=1.26,<3",
    "PyYAML==6.0.3",
    "torch==2.7.1",
    "transformers==4.49.0",
    "peft==0.14.0",
    "safetensors>=0.4.1",
    "jsonschema>=4,<5",
    "tensorboard>=2,<3",
    "playwright>=1.58,<2",
]

[tool.uv.dependency-groups]
research = { requires-python = ">=3.12,<3.14" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests", "research/tests"]
pythonpath = [".", "tests"]

